defaults:
  - _self_

paths:
  repo_root: ${hydra:runtime.cwd}
  tmp_root: ${paths.repo_root}/tmp
  results_root: ${paths.repo_root}/results

output:
  # Required. This is the "useful outputs" directory (profiling root) written for the user.
  dir: ???
  # Optional. Intermediate outputs for debugging. Defaults to <output.dir>/cache.
  cache_dir: ${output.dir}/cache
  model_slug: llama2-7b
  scheduler_name: sarathi-serve

model:
  model_id: meta-llama/Llama-2-7b-hf

hardware:
  hardware_id: a100
  network_device: a100_pairwise_nvlink

profiling:
  num_gpus: 1
  tensor_parallel_size: 1
  max_tokens: 4096

  mlp:
    # REQUIRED (no default). How Vidur measures per-op time for MLP profiling:
    # - cuda_event: CUDA events around ops (recommended; stable GPU-time measurement).
    # - record_function: torch.profiler record_function trace attribution (higher overhead; uses kernel correlation).
    #   Caveat: this path can miss GPU time for kernels launched via the CUDA *driver* API, yielding missing
    #   timings in `mlp.csv` (the motivating bug fixed by 005-vidur-mlp-cuda-driver).
    # - kineto: torch.profiler (Kineto) trace aggregation (high overhead; useful for debugging/investigation).
    # - perf_counter: time.perf_counter wall-clock with cuda synchronize (coarse; includes sync/launch overhead).
    # NOTE: Before the 005-vidur-mlp-cuda-driver change, this repo relied on Vidur's default, which is
    # `record_function`. To reproduce the old behavior, set `profile_method=record_function`.
    profile_method: ???
    validation:
      # strict (default) | non_strict
      mode: strict
      # How to handle missing (NaN) core timing targets in `mlp.csv`.
      #
      # - auto (default): strict => reject; non_strict => drop (per-target) during consumption.
      # - reject: always reject NaNs (ignores strict/non_strict for NaN handling).
      # - drop: allow NaNs and drop missing samples per target during consumption
      #   (ignores strict/non_strict for NaN handling).
      # - zero: allow NaNs and fill missing targets with 0 during consumption
      #   (ignores strict/non_strict for NaN handling; can bias predictors).
      nan_policy: auto
      small_input_threshold: 128
      zero_heavy_limit: 0.01
    fallback:
      enabled: false
      method: cuda_event

  # Keep the exported bundle compute-only for TP=1/PP=1 experiments.
  include_network: false

  # By default, fail if attention profiling cannot be measured on this host.

  cpu_overhead:
    # Optional. Disabled by default to match the Vidur paper's evaluation practice
    # (optimized serving stack with CUDA graphs to eliminate unnecessary CPU overheads).
    enabled: false
    max_batch_size: 128
    # Guardrails: `strict` rejects placeholder-like dummy CSVs.
    validation: strict

  attention:
    profile_mode: both
    backend: FLASHINFER
    block_size: 16
    min_batch_size: 1
    max_batch_size: 128

hydra:
  run:
    dir: ${output.cache_dir}/hydra
  job:
    chdir: true
