defaults:
  - scenario: llama2_7b_arxiv
  - _self_

paths:
  repo_root: ${hydra:runtime.cwd}
  tmp_root: ${paths.repo_root}/tmp
  results_root: ${paths.repo_root}/results

profiling:
  # Conservative defaults for a bounded local profiling run.
  num_gpus: 1
  max_tokens: ${scenario.trace_source.max_tokens}
  tensor_parallel_size: ${scenario.vidur.tensor_parallel_size}

  mlp:
    # REQUIRED (no default). How Vidur measures per-op time for MLP profiling:
    # - cuda_event: CUDA events around ops (recommended; stable GPU-time measurement).
    # - record_function: torch.profiler record_function trace attribution (higher overhead; uses kernel correlation).
    # - kineto: torch.profiler (Kineto) trace aggregation (high overhead; useful for debugging/investigation).
    # - perf_counter: time.perf_counter wall-clock with cuda synchronize (coarse; includes sync/launch overhead).
    # NOTE: Before the 005-vidur-mlp-cuda-driver change, this repo relied on Vidur's default, which is
    # `record_function`. To reproduce the old behavior, set `profile_method=record_function`.
    profile_method: ???
    validation:
      # strict (default) | non_strict
      mode: strict
      small_input_threshold: 128
      zero_heavy_limit: 0.01
    fallback:
      enabled: false
      method: cuda_event

  # Default: include CPU overhead microbenchmarks (sim-vs-real parity).
  # Disable only for debugging or when CPU overhead is intentionally excluded.
  include_cpu_overhead: true
  cpu_overhead:
    # Bound CPU overhead profiling work for fast iteration.
    max_batch_size: 128
    # Guardrails: `strict` rejects placeholder-like dummy CSVs.
    validation: strict

hydra:
  run:
    dir: ${paths.tmp_root}/paper_fidelity/runs/${scenario.name}/profile
  job:
    chdir: true
