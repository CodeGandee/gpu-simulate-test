defaults:
  - scenario: llama2_7b_arxiv
  - workload: static
  - _self_
  - scale: full

trace_subset:
  # Subset selection is by row index in the canonical trace representation.
  # kind: all|range|indices
  kind: all
  begin: 0
  end: null
  indices: null

# Optional: include paper reference values (when available for the scenario/workload).
paper_reference:
  enabled: false

paths:
  repo_root: ${hydra:runtime.cwd}
  tmp_root: ${paths.repo_root}/tmp
  results_root: ${paths.repo_root}/results

hydra:
  run:
    dir: ${paths.tmp_root}/paper_fidelity/runs/${scenario.name}/repro
  job:
    chdir: true
