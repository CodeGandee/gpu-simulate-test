name: internlm_20b_arxiv

model:
  model_id: internlm/internlm-20b
  model_ref: ${paths.repo_root}/models/internlm-20b/source-data

trace_source:
  kind: vidur_processed_lengths_csv
  path: ${paths.repo_root}/extern/tracked/vidur/data/processed_traces/arxiv_summarization_stats_llama2_tokenizer_filtered_v2.csv
  max_tokens: 4096
  seed: 42
  num_requests: null

vidur:
  profiling_root: ${paths.repo_root}/extern/tracked/vidur
  device: a100
  network_device: a100_pairwise_nvlink
  tensor_parallel_size: 1
  num_pipeline_stages: 1
  seed: 42
  # CPU overhead modeling should be explicitly enabled/disabled for sim-vs-real parity.
  # Default: enabled for sim-vs-real parity. Disable only when intentionally excluding CPU overhead.
  skip_cpu_overhead_modeling: false
  cpu_overhead:
    # Guardrails when `skip_cpu_overhead_modeling=false`. Use `warn`/`off` only for debugging.
    validation: strict
  # Parity-critical scheduler knobs: do not rely on Vidur defaults.
  # Align these with the real runner's scheduler settings unless intentionally studying drift.
  scheduler:
    type: sarathi
    # Match Sarathi-Serve paper-fidelity runner settings.
    chunk_size: ${scenario.real.scheduler.chunk_size}
    batch_size_cap: ${scenario.real.scheduler.max_num_seqs}
    # KV-cache page/block size (Vidur uses this for memory planning and per-iteration modeling).
    block_size: 16
    watermark_blocks_fraction: 0.01

real:
  backend: sarathi
  sampling:
    ignore_eos: true
  scheduler:
    chunk_size: 16
    max_num_seqs: 16
  parallel:
    tensor_parallel_size: 1
    pipeline_parallel_size: 1
  metrics:
    write_metrics: true
    enable_chrome_trace: false

capacity_search:
  enabled: true
  min_qps: 1.0
  max_qps: 20.0
  max_iters: 6
  overload_p99_scheduling_delay_s: 5.0
  qps_operating_point_fraction: 0.85

scoring:
  percentiles: [0.5, 0.95]
  thresholds:
    pass_pct: 0.05
    warn_pct: 0.09

paper_reference:
  enabled: true
  model: InternLM-20B (TP2)
  trace: Arxiv-4K
  series: predicted
  static:
    metric: request_execution_plus_preemption_time_normalized
    p50_json: ${paths.repo_root}/context/summaries/vidur-kb/paper-results/static_fidelity_v12_request_execution_plus_preemption_time_normalized_p50.json
    p95_json: ${paths.repo_root}/context/summaries/vidur-kb/paper-results/static_fidelity_v12_request_execution_plus_preemption_time_normalized_p95.json
  dynamic:
    metric: request_e2e_time_normalized
    load_frac_of_capacity: 0.85
    p50_json: ${paths.repo_root}/context/summaries/vidur-kb/paper-results/dynamic_fidelity_v8_request_e2e_time_normalized_85_p50.json
    p95_json: ${paths.repo_root}/context/summaries/vidur-kb/paper-results/dynamic_fidelity_v8_request_e2e_time_normalized_85_p95.json

# Debugging: trace subsetting for fast iteration (override at the command line).
# - Range subset (Python slicing semantics; end-exclusive):
#     trace_subset.kind=range trace_subset.begin=0 trace_subset.end=32
# - Discrete indices (only for untimed trace sources like `vidur_processed_lengths_csv`):
#     trace_subset.kind=indices trace_subset.indices=[0,3,10,42]
