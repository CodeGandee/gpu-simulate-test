model_key: qwen3_0_6b
profiling:
  root: ${paths.tmp_root}/vidur_profiling/${hardware.hardware_id}/${vidur.model_key}

validation:
  mlp:
    # How to handle missing (NaN) core timing targets when consuming a profiling root.
    #
    # - auto (default): strict => reject; non_strict => drop (per-target) during training.
    # - reject: always reject NaNs (ignores strict/non_strict for NaN handling).
    # - drop: allow NaNs and drop missing samples per target during training
    #   (ignores strict/non_strict for NaN handling).
    # - zero: allow NaNs and fill missing targets with 0 during training
    #   (ignores strict/non_strict for NaN handling; can bias predictors).
    nan_policy: auto
    mode: strict
    small_input_threshold: 128
    zero_heavy_limit: 0.01
