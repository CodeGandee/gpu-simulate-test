defaults:
  - model: qwen3_0_6b
  - hardware: a100
  - vidur: default
  - _self_

paths:
  repo_root: ${hydra:runtime.cwd}
  tmp_root: ${paths.repo_root}/tmp

output:
  run_id: ${stable_id:vidur_profile,${model.model_id},${hardware.hardware_id}}

profiling:
  mlp:
    # REQUIRED (no default): record_function | cuda_event | kineto | perf_counter (Vidur choices)
    profile_method: ???
    validation:
      # strict (default) | non_strict
      mode: strict
      small_input_threshold: 128
      zero_heavy_limit: 0.01
    fallback:
      enabled: false
      method: cuda_event

hydra:
  run:
    dir: ${vidur.profiling.root}
  job:
    chdir: true
